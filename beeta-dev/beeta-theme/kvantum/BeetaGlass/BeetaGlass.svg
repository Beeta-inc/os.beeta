<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Window -->
    <rect id="window" x="10" y="10" width="100" height="100" rx="14" ry="14"/>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12142d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080a18" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Buttons -->
    <rect id="button" x="20" y="20" width="60" height="30" rx="10" ry="10"/>
    <!-- Menu -->
    <rect id="menu" x="30" y="30" width="80" height="120" rx="14" ry="14"/>
    <!-- Tabs -->
    <rect id="tab" x="40" y="40" width="50" height="25" rx="8" ry="8"/>

    <!-- Common styles are defined in the kvconfig, we just need basic shapes here. -->
  </defs>

  <!-- Dummy elements required by Kvantum SVGs. Real theming is done via Kvantum's SVG IDs and rendering engine based on kvconfig -->
  <g id="window">
    <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <g id="button">
    <rect x="70" y="0" width="32" height="32" rx="10" ry="10" fill="rgba(238,241,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <g id="menu">
    <rect x="0" y="70" width="64" height="64" rx="14" ry="14" fill="rgba(22,24,50,0.95)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <g id="menuitem">
    <rect x="70" y="70" width="32" height="32" rx="8" ry="8" fill="transparent"/>
  </g>

  <g id="tooltip">
    <rect x="0" y="140" width="64" height="32" rx="10" ry="10" fill="rgba(22,24,50,1.0)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>
</svg>
