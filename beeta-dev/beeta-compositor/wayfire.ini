#
# This configures the Wayfire Wayland compositor for Beeta OS.
# Wayfire provides the window management, compositing, blur effects,
# and workspace switching that the Beeta Shell panels control.
#
# Installed to: /etc/beeta/wayfire.ini
# User override: ~/.config/beeta/wayfire.ini
# ═══════════════════════════════════════════════════════════════

[core]
# Plugins to load
# blur          — Liquid Glass backdrop blur effect
# animate       — Window open/close animations
# alpha         — Per-window transparency control
# vswitch       — Virtual workspace switching
# wm-actions    — Window maximize/minimize/close
# move          — Window dragging
# resize        — Window resizing
# place         — Initial window placement
# decoration    — Server-side window decorations
# autostart     — Auto-start applications
# command       — Keybinding commands
# fast-switcher — Alt+Tab window switching
# grid          — Window tiling/snapping
plugins = blur animate alpha vswitch wm-actions move resize place decoration autostart command fast-switcher grid

# Number of virtual workspaces (horizontal × vertical)
vwidth = 3
vheight = 1

# Preferred decoration mode
preferred_decoration_mode = server

[output]
# Default mode: automatic resolution detection
mode = auto

[blur]
# Liquid Glass™ backdrop blur configuration
# This is the core visual effect of Beeta OS
method = kawase
blur_radius = 7
blur_offset = 5
saturation = 1.1
toggle = none

# Blur behind layer-shell surfaces (panels)
# This is what makes the top bar and bottom bar glassy
blur_by_default = all

[animate]
# Window animation style
open_animation = zoom
close_animation = zoom
duration = 300
startup_duration = 500

# Minimize animation
minimize_animation = squeeze
minimize_duration = 250

[alpha]
# Per-window transparency (can be adjusted per-window)
modifier = <super>

[decoration]
# Server-side window decoration style
title_height = 30
border_size = 2
font = Inter
active_color = 0.07 0.07 0.15 0.85
inactive_color = 0.05 0.05 0.12 0.75

[vswitch]
# Virtual workspace switching
binding_left = <super> KEY_LEFT
binding_right = <super> KEY_RIGHT
binding_up = <super> KEY_UP
binding_down = <super> KEY_DOWN

# Workspace switch animation
duration = 300
gap = 20

# Workspace switching with window carry
with_win_left = <super> <shift> KEY_LEFT
with_win_right = <super> <shift> KEY_RIGHT
with_win_up = <super> <shift> KEY_UP
with_win_down = <super> <shift> KEY_DOWN

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[place]
mode = center

[wm-actions]
toggle_fullscreen = <super> KEY_F
minimize = <super> KEY_H

[command]
# Terminal emulator
repeatable_binding_terminal = <super> KEY_T
command_terminal = beeta-terminal || gnome-terminal || xterm

# File manager
repeatable_binding_files = <super> KEY_E
command_files = nautilus || thunar || pcmanfm

# Screenshot
repeatable_binding_screenshot = KEY_PRINT
command_screenshot = sh -c 'mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/Screenshot_$(date +%Y%m%d_%H%M%S).png'

# Lock screen
repeatable_binding_lock = <super> KEY_L
command_lock = beeta-lock

# Close focused window
repeatable_binding_close = <super> KEY_Q
command_close = wlrctl toplevel close

[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB

[grid]
# Window tiling with keyboard
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP
slot_b = <super> KEY_DOWN
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3
restore = <super> KEY_KP5

[autostart]
# Applications to start with the session
# (beeta-shell is started by beeta-session, not here)

# Start notification daemon
a0 = mako || dunst || true

# Start PipeWire (if not started by systemd)
a1 = pipewire || true

# Start XDG desktop portal
a2 = /usr/libexec/xdg-desktop-portal -r || true
a3 = /usr/libexec/xdg-desktop-portal-gtk -r || true
a4 = /usr/libexec/xdg-desktop-portal-wlr -r || true

# Start PolicyKit agent
a5 = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || true

# Start Beeta UI Architecture Engine (Adaptive Nature Theme Daemon)
a6 = beeta-themed || true

[input]
# Touchpad settings
tap_to_click = true
natural_scroll = true
disable_while_typing = true
click_method = clickfinger

# Keyboard repeat
kb_repeat_rate = 40
kb_repeat_delay = 250

# Mouse acceleration
mouse_accel_profile = adaptive

[idle]
# Idle timeout (seconds) — blank screen after 5 minutes
dpms_timeout = 300
