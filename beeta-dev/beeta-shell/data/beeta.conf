[Desktop]
# Number of virtual workspaces (1-10)
workspaces = 3

# Adaptive Nature™ mode: static | adaptive | expressive
#   static     — fixed theme, no context-based changes
#   adaptive   — subtly responds to time, weather, battery (recommended)
#   expressive — bolder transitions and richer ambient effects
adaptive_nature_mode = adaptive

# Performance mode: power-saver | balanced | performance
#   power-saver  — reduced blur (8px), simple fades, no particles
#   balanced     — standard Beeta animations (20px blur)
#   performance  — full animations, rich blur (28px), ambient effects
performance_mode = balanced

# Laptop detection: auto | true | false
#   auto — detects by checking /sys/class/power_supply/BAT*
is_laptop = auto

[Dock]
# Pinned applications (semicolon-separated .desktop file IDs)
pinned_apps = org.gnome.Nautilus;org.gnome.Terminal;firefox;org.gnome.Calculator;gnome-control-center

# Dock icon size in pixels (24-96)
icon_size = 48

# Hover magnification factor (1.0-1.5)
hover_magnification = 1.15

[LiveCenter]
# Toggle which activity types appear in the Live Center
show_media = true
show_downloads = true
show_timers = true
show_recording = true
show_sharing = true

[Charging]
# Minimum charge rate (watts) to show branded charging labels
turbo_charge_min_watts = 45
fast_charge_min_watts = 15

[Glass]
# Glass panel background opacity (0.3-1.0)
# Lower = more transparent. 0.75 recommended for readability.
opacity = 0.75

# Backdrop blur radius in pixels (compositor-dependent)
blur_radius = 20

# Glass border opacity (0.0-1.0)
border_opacity = 0.12

# Glass shadow opacity (0.0-1.0)
shadow_opacity = 0.4

[Weather]
# Open-Meteo API endpoint (free, no key required)
api_url = https://api.open-meteo.com/v1/forecast

# Update interval in minutes
update_interval_minutes = 30

# Location coordinates (leave empty for auto-detection via GeoClue)
latitude =
longitude =
